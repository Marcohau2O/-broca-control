services:

  broca-web:
    container_name: broca-control-web

    build:
      context: ./services/broca-web
      dockerfile: Dockerfile

    ports:
      - "5173:5173"
    
    volumes:
      - ./services/broca-web:/app
      - broca-web_node_modules:/app/node_modules

    environment:
      - CHOKIDAR_USEPOLLING=true

    command:
      pnpm run dev -- --host 0.0.0.0

  
  broca-api:
    container_name: broca-control-api

    build:
      context: ./services/broca-api
      dockerfile: Dockerfile

    ports:
      - "4000:4000"
      
    volumes:
      - ./services/broca-api:/app
      - broca-api_node_modules:/app/node_modules

    environment:
      PORT: ${PORT}
      DATABASE_URL: ${DATABASE_URL}


volumes:
  broca-web_node_modules:
  broca-api_node_modules: